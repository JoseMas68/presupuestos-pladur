<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pladur Pro · Presupuestos</title>
<style>
:root{
  --azul:#add8c7; --azul-osc:#8fc4ae; --naranja:#253832; --salvia:#add8c7; --carbon:#253832; --gris-fondo:#f1f4f2;
  --gris-borde:#dbe2ea; --texto:#1a2532; --texto-suave:#5b6b7c; --ok:#1e9e55; --rojo:#d94343;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--gris-fondo);color:var(--texto);font-size:15px}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font-family:inherit;font-size:15px;color:var(--texto);border:1px solid var(--gris-borde);border-radius:8px;padding:10px 12px;width:100%;background:#fff;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--azul)}
label{font-size:12px;font-weight:600;color:var(--texto-suave);display:block;margin:12px 0 5px;text-transform:uppercase;letter-spacing:.4px}

/* ===== Layout app ===== */
#app{margin:0 auto;min-height:100vh;background:#fff;display:flex;flex-direction:column;width:100%}
.cuerpo{flex:1;display:flex;flex-direction:column;min-width:0;width:100%}
.cabecera{background:linear-gradient(135deg,var(--azul) 0%,var(--azul-osc) 100%);color:var(--carbon);padding:16px 18px 14px;position:sticky;top:0;z-index:50}
.cabecera .fila{display:flex;align-items:center;justify-content:space-between}
.cabecera h1{font-size:17px;font-weight:700;letter-spacing:.5px}
.cabecera .sub{font-size:11px;opacity:.75;margin-top:2px;text-transform:uppercase;letter-spacing:1px}
.logo-mini{width:34px;height:34px;border-radius:8px;background:#fff;color:#253832;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px}
.contenido{flex:1;padding:16px 16px 92px;width:100%;max-width:760px;margin:0 auto}
.pie-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--gris-borde);display:flex;z-index:60}
.pie-nav button{flex:1;padding:9px 0 7px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--texto-suave);font-size:10px;font-weight:600}
.pie-nav button svg{display:block}
.pie-nav button.activo{color:#253832}
.lateral{display:none}
@media(min-width:960px){
  #app{flex-direction:row}
  .lateral{display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;width:236px;background:#fff;border-right:1px solid var(--gris-borde);padding:26px 16px 20px;z-index:70}
  .lateral-marca{display:flex;align-items:center;gap:11px;padding:0 8px;margin-bottom:26px}
  .lateral-marca .lm1{font-weight:800;font-size:15px;letter-spacing:.4px;line-height:1.2;color:var(--carbon)}
  .lateral-marca .lm2{font-size:10.5px;color:var(--texto-suave);margin-top:1px}
  .lateral-nav{display:flex;flex-direction:column;gap:4px}
  .lateral-nav button{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:10px;color:var(--texto-suave);font-weight:600;font-size:14px;text-align:left;width:100%}
  .lateral-nav button:hover{background:#f6f4f2;color:var(--texto)}
  .lateral-nav button.activo{background:#eaf3ee;color:#253832}
  .lateral-nota{margin-top:auto;font-size:10px;color:var(--texto-suave);line-height:1.5;padding:0 8px}
  .cuerpo{margin-left:236px;width:calc(100% - 236px)}
  .cabecera{display:none}
  .pie-nav{display:none}
  .contenido{max-width:860px;padding:34px 40px 70px}
  .grid-inicio{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
  .grid-inicio .full{grid-column:1/-1}
  .editor-grid{display:grid;grid-template-columns:1.45fr 1fr;gap:24px;align-items:start}
  .editor-fija{position:sticky;top:24px}
}
@media(hover:hover){.lista-item{transition:border-color .15s,background .15s}.lista-item:hover{border-color:#bfd8c9;background:#fafcfa}}
.boton{display:flex;align-items:center;justify-content:center;gap:8px}
.boton.mini{display:inline-flex}

/* ===== Componentes ===== */
.tarjeta{background:#fff;border:1px solid var(--gris-borde);border-radius:12px;padding:14px;margin-bottom:12px}
.tarjeta h3{font-size:15px;margin-bottom:4px}
.suave{color:var(--texto-suave);font-size:12.5px}
.fila-entre{display:flex;align-items:center;justify-content:space-between;gap:10px}
.boton{background:var(--azul);color:var(--carbon);border-radius:10px;padding:13px 16px;font-weight:700;font-size:15px;width:100%;text-align:center}
.boton:active{opacity:.85}
.boton.naranja{background:var(--naranja);color:#fff}
.boton.sec{background:#eaf3ee;color:#253832;border:1px solid #c9ddd1}
.boton.rojo{background:#fdecec;color:var(--rojo);border:1px solid #f5c6c6}
.boton.mini{width:auto;padding:7px 12px;font-size:13px;border-radius:8px}
.boton:disabled{opacity:.45;cursor:default}
.chip{display:inline-block;background:#eaf3ee;color:#253832;border-radius:20px;padding:3px 10px;font-size:11.5px;font-weight:700}
.chip.gris{background:#eef1f4;color:var(--texto-suave)}
.lista-item{background:#fff;border:1px solid var(--gris-borde);border-radius:12px;padding:13px 14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.lista-item:active{background:#f7fafd}
.lista-item .nombre{font-weight:600;font-size:14.5px;line-height:1.3}
.lista-item .det{color:var(--texto-suave);font-size:12px;margin-top:3px}
.lista-item .imp{font-weight:700;font-size:14.5px;white-space:nowrap;text-align:right}
.vacio{text-align:center;padding:40px 20px;color:var(--texto-suave)}
.vacio .ico{margin-bottom:10px;color:#9fb0a6}.vacio .ico svg{display:block;margin:0 auto}
.badge{font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:5px;text-transform:uppercase;letter-spacing:.5px}
.badge.borrador{background:#fff4e0;color:#b26d00}
.badge.enviado{background:#e2f4e9;color:var(--ok)}
.buscador{margin-bottom:12px}

/* ===== Editor presupuesto ===== */
.bloque-cap{margin-bottom:14px}
.cap-cab{background:#eaf3ee;border-radius:10px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center}
.cap-cab .tit{font-weight:700;font-size:13.5px;color:#253832;text-transform:uppercase;letter-spacing:.5px}
.partida{padding:10px 4px;border-bottom:1px solid #eef1f4}
.partida:last-child{border-bottom:none}
.partida .nombre{font-size:13.5px;font-weight:600;line-height:1.35}
.partida .med{color:var(--texto-suave);font-size:12px;margin-top:2px}
.partida .imp{font-weight:700;white-space:nowrap}
.totales{background:#f7fafc;border:1px solid var(--gris-borde);border-radius:12px;padding:14px;margin:16px 0}
.totales .fila{display:flex;justify-content:space-between;padding:4px 0;font-size:14px}
.totales .total{border-top:2px solid var(--texto);margin-top:8px;padding-top:10px;font-size:17px;font-weight:800}
.resumen-material{background:#f0f7f2;border:1px solid #cfe3d6;border-radius:12px;padding:14px;margin-top:16px}
.resumen-material h4{font-size:13px;color:#253832;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;display:flex;align-items:center;gap:7px}
.resumen-material .fila>span:first-child{display:flex;align-items:center;gap:6px}
.resumen-material .fila{display:flex;justify-content:space-between;font-size:13px;padding:3px 0}
.acciones-fila{display:flex;gap:8px;margin-top:14px}
.acciones-fila .boton{flex:1;padding:11px;font-size:14px}

/* ===== Modal ===== */
.modal-fondo{position:fixed;inset:0;background:rgba(10,20,35,.55);z-index:100;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:600px){.modal-fondo{align-items:center}}
.modal{background:#fff;width:100%;max-width:560px;border-radius:16px 16px 0 0;max-height:92vh;overflow-y:auto;padding:18px}
@media(min-width:600px){.modal{border-radius:16px}}
.modal h2{font-size:16px;margin-bottom:4px}
.modal-cerrar{font-size:22px;color:var(--texto-suave);padding:4px 8px}
.zona-precio{background:#eaf3ee;border-radius:10px;padding:12px;margin-top:10px}
.zona-precio .fila{display:flex;justify-content:space-between;align-items:baseline;padding:3px 0}
.zona-precio .imp{font-size:19px;font-weight:800;color:var(--azul-osc)}
.grupo-mat{margin-top:6px}
.grupo-mat .fila{display:flex;justify-content:space-between;font-size:13.5px;padding:5px 0;border-bottom:1px dashed #e3e9f0}
.grupo-mat .fila:last-child{border-bottom:none}

/* ===== PDF (estilo Metro Cuadrado) ===== */
#vista-pdf{display:none}
@media print{
  body{background:#fff}
  #app{display:none !important}
  #vista-pdf{display:block !important}
  .pagina-pdf{page-break-after:always;margin:0;box-shadow:none;zoom:1 !important}
  @page{size:A4;margin:0}
}
.pagina-pdf{width:210mm;min-height:297mm;margin:28px auto;background:#fff;padding:14mm 16mm;font-size:10.5px;color:#111;box-shadow:0 6px 32px rgba(0,0,0,.16)}
.pdf-cab{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px}
.pdf-titulo-doc{font-size:24px;font-weight:800;color:#111;letter-spacing:-.3px}
.pdf-numfecha{margin-top:14px;font-size:10px;color:#222}
.pdf-numfecha table{border-collapse:collapse}
.pdf-numfecha td{padding:2px 18px 2px 0;vertical-align:top}
.pdf-numfecha td:first-child{font-weight:700}
.pdf-marca{text-align:right}
.pdf-marca .casa{display:inline-block;vertical-align:middle;margin-right:9px}
.pdf-marca .nombre{display:inline-block;vertical-align:middle;text-align:left}
.pdf-marca .l1{font-size:16px;font-weight:800;color:#253832;line-height:1.1;letter-spacing:.6px}
.pdf-marca .l2{font-size:7.5px;color:#8a7d79;letter-spacing:2.2px;margin-top:3px;line-height:1.4}
.pdf-doscol{display:flex;justify-content:space-between;font-size:10px;line-height:1.65;margin-bottom:22px}
.pdf-doscol b{color:#111}
table.pdf-tabla{width:100%;border-collapse:collapse;font-size:10px}
table.pdf-tabla th{color:#444;padding:6px 7px;text-align:left;font-size:8.5px;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid #999;font-weight:600}
table.pdf-tabla th.num,table.pdf-tabla td.num{text-align:right}
table.pdf-tabla td{padding:7px 7px;border-bottom:1px solid #e2e2e2;vertical-align:top}
tr.capitulo td{font-weight:800;font-size:11px;border-bottom:1px solid #555;padding-top:11px}
tr.ultimo td{border-bottom:1px solid #999}
.pdf-tot{margin-top:16px;width:100%}
.pdf-tot table{margin-left:auto;border-collapse:collapse;font-size:10.5px}
.pdf-tot td{padding:5px 10px}
.pdf-tot td.et{color:#333;text-align:right}
.pdf-tot td.vl{font-weight:700;text-align:right;min-width:110px}
.pdf-tot tr.final td{font-size:12.5px;font-weight:800;padding-top:10px}
.pdf-obs{margin-top:22px;font-size:8.6px;line-height:1.55;color:#222;text-align:justify}
.pdf-obs h4,.pdf-pago h4{font-size:10px;color:#111;text-transform:uppercase;letter-spacing:.8px;margin-bottom:5px}
.pdf-pago{margin-top:14px;font-size:9px;color:#222;line-height:1.5}
.pdf-pie{margin-top:24px;border-top:1px solid #bbb;padding-top:8px;display:flex;justify-content:space-between;font-size:8.5px;color:#777}
.aviso-demo{background:#fff4e0;border:1px solid #f0d9a8;border-radius:8px;padding:8px 12px;font-size:11px;color:#8a6d1a;margin-bottom:12px}

/* ===== Franja demo Lumicatech ===== */
.franja-demo{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:6px 12px;padding:8px 16px;background:#fff8e1;border-bottom:1px solid #f0d98a;color:#6b5200;font-size:12px;line-height:1.4;text-align:center}
.franja-demo b{background:#f5b800;color:#3d2e00;border-radius:4px;padding:1px 7px;font-size:11px;letter-spacing:.6px}
.franja-demo .por{display:inline-flex;align-items:center;gap:6px;color:#5b6b7c;white-space:nowrap}
.franja-demo img{height:14px;width:auto;display:block}
@media print{.franja-demo{display:none !important}}
</style>
</head>

const OBS_PLANTILLA=`Métodos de pago. Anticipo del material de cada fase antes de pedirlo (el importe del pedido de material según factura del proveedor), el resto a certificación cada 15 días. Pago a 7 días de la certificación, el retraso de más de 10 días en un pago facultará a Metro Cuadrado a paralizar los trabajos sin penalización.

e acordará entre ambas partes. LOS PRECIOS SERÁN ACTUALIZADOS EN CASO DE ACEPTACIÓN, SEGÚN LAS TARIFAS VIGENTES EN LA FECHA DE INICIO DE LOS TRABAJOS. Criterio de medición según UNE 92305:2020. Huecos menores a 5 m² no se deducirán. Se deducirá el 50% del hueco mayor o igual a 5 m² e inferior o igual a 8 m², si el hueco es mayor a 8 m², se deducirá todo el hueco. Metro lineal = metro cuadrado. Al final de la obra se medirá a cinta corrida. Si el precio de la materia prima se incrementa, al cliente se le cobrará la diferencia.`;

/* totales de un presupuesto */
function totales(p){
  let base=0;
  for(const c of p.capitulos){c.importe=0;for(const it of c.items){it.importe=it.precio*it.cantidad;c.importe+=it.importe}base+=c.importe}
  const iva=base*(p.iva??db.empresa.iva)/100;
  return{base,iva,total:base+iva};
}
/* materiales + horas agregados del presupuesto */
function materiales(p){
  const mat={},cat=Object.fromEntries(db.catalogo.map(x=>[x.id,x]));
  let horas=0;
  for(const c of p.capitulos)for(const it of c.items){
    const r=cat[it.catId];if(!r)continue;
    horas+=r.horas*it.cantidad;
    for(const[m,q]of r.receta)mat[m]=(mat[m]||0)+q*it.cantidad;
  }
  const dias=Math.ceil(horas/8/3); /* equipo estimado 3 operarios */
  return{mat,horas,dias};
}

function modal(html){document.getElementById('modal-cont').innerHTML=html;document.getElementById('modal-fondo').style.display='flex'}
function cerrarModal(){document.getElementById('modal-fondo').style.display='none'}

function modalCliente(id){
  const c=id?db.clientes.find(x=>x.id===id):{};
  modal(`<div class="fila-entre"><h2>${id?'Editar cliente':'Nuevo cliente'}</h2><button class="modal-cerrar" onclick="cerrarModal()">×</button></div>
  <label>Nombre / razón social</label><input id="c-nombre" value="${esc(c.nombre||'')}">
  <label>CIF / NIF</label><input id="c-cif" value="${esc(c.cif||'')}">
  <label>Dirección</label><input id="c-dir" value="${esc(c.direccion||'')}">
  <label>Población</label><input id="c-pob" value="${esc(c.poblacion||'')}">
  <label>Teléfono</label><input id="c-tel" value="${esc(c.tel||'')}">
  <label>Email</label><input id="c-mail" value="${esc(c.email||'')}">
  <div style="height:12px"></div>
  <button class="boton" onclick="guardarCliente('${id||''}')">Guardar</button>
  ${id?'<div style="height:8px"></div><button class="boton rojo" onclick="borrarCliente(\''+id+'\')">Eliminar</button>':''}`);
}
function guardarCliente(id){
  const d={nombre:v('c-nombre'),cif:v('c-cif'),direccion:v('c-dir'),poblacion:v('c-pob'),tel:v('c-tel'),email:v('c-mail')};
  if(!d.nombre){alert('Falta el nombre');return}
  if(id){Object.assign(db.clientes.find(x=>x.id===id),d)}
  else db.clientes.push({id:'c'+Date.now(),...d});
  guardar();cerrarModal();render();
}
function borrarCliente(id){if(!confirm('¿Eliminar cliente?'))return;db.clientes=db.clientes.filter(x=>x.id!==id);guardar();cerrarModal();render()}

function modalPartida(id){
  const x=id?db.catalogo.find(y=>y.id===id):{cap:db.capitulos[0],ud:'m²',receta:[]};
  modal(`<div class="fila-entre"><h2>${id?'Editar partida':'Nueva partida'}</h2><button class="modal-cerrar" onclick="cerrarModal()">×</button></div>
  <label>Descripción</label><textarea id="x-nombre" rows="2">${esc(x.nombre||'')}</textarea>
  <label>Capítulo</label>
  <select id="x-cap">${db.capitulos.map(c=>`<option ${x.cap===c?'selected':''}>${esc(c)}</option>`).join('')}</select>
  <label>Unidad</label>
  <select id="x-ud">${['m²','ml','ud'].map(u=>`<option ${x.ud===u?'selected':''}>${u}</option>`).join('')}</select>
  <label>Precio de venta (€/${x.ud||'ud'})</label><input id="x-precio" type="number" step="0.01" value="${x.precio??''}">
  <label>Horas por unidad</label><input id="x-horas" type="number" step="0.05" value="${x.horas??''}">
  <div style="height:12px"></div><h3 style="font-size:14px">Receta de materiales (por unidad)</h3>
  <div id="receta">${(x.receta||[]).map(([m,q])=>filaReceta(m,q)).join('')}</div>
  <button class="boton mini sec" style="margin-top:8px" onclick="addFilaReceta()">${ico('plus',14)} Material</button>
  <div style="height:14px"></div>
  <button class="boton" onclick="guardarPartida('${id||''}')">Guardar partida</button>
  ${id?'<div style="height:8px"></div><button class="boton rojo" onclick="borrarPartida(\''+id+'\')">Eliminar</button>':''}`);
}
function filaReceta(m,q){return `<div class="grupo-mat" style="display:flex;gap:6px;margin-top:6px">
  <input class="r-mat" placeholder="Material" value="${esc(m||'')}" style="flex:2">
  <input class="r-can" type="number" step="0.01" placeholder="Cant." value="${q??''}" style="flex:1"></div>`}
function addFilaReceta(){document.getElementById('receta').insertAdjacentHTML('beforeend',filaReceta('',''))}
function guardarPartida(id){
  const receta=[...document.querySelectorAll('#receta .grupo-mat')].map(g=>[g.querySelector('.r-mat').value.trim(),parseFloat(g.querySelector('.r-can').value)||0]).filter(r=>r[0]);
  const d={nombre:v('x-nombre'),cap:v('x-cap'),ud:v('x-ud'),precio:parseFloat(v('x-precio'))||0,horas:parseFloat(v('x-horas'))||0,receta};
  if(!d.nombre){alert('Falta la descripción');return}
  if(id){Object.assign(db.catalogo.find(x=>x.id===id),d)}
  else db.catalogo.push({id:'x'+Date.now(),...d});
  guardar();cerrarModal();render();
}
function borrarPartida(id){if(!confirm('¿Eliminar partida del catálogo?'))return;db.catalogo=db.catalogo.filter(x=>x.id!==id);guardar();cerrarModal();render()}

/* --- Añadir partida al presupuesto: lista catálogo -> medición --- */
function modalAddPartida(pid){
  const caps={};db.catalogo.forEach(x=>{(caps[x.cap]=caps[x.cap]||[]).push(x)});
  modal(`<div class="fila-entre"><h2>Añadir partida</h2><button class="modal-cerrar" onclick="cerrarModal()">×</button></div>
  <input class="buscador" id="b-catalogo" placeholder="Buscar partida…" oninput="filtraCatalogo(this.value)">
  <div id="lista-add">${Object.entries(caps).map(([cap,items])=>`
    <div class="bloque-cap" data-cap="${esc(cap.toLowerCase())}" data-nombres="${esc(items.map(i=>i.nombre.toLowerCase()).join('|'))}">
    <div class="cap-cab"><span class="tit">${esc(cap)}</span></div>
    ${items.map(x=>`<div class="partida" onclick="modalMedicionNueva('${pid}','${x.id}')">
      <div class="fila-entre"><div style="flex:1"><div class="nombre">${esc(x.nombre)}</div>
      <div class="med">${x.ud} · ${num(x.precio)} €/${x.ud}</div></div>
      <span class="chip">${ico('plus',13)}</span></div></div>`).join('')}
    </div>`).join('')}</div>`);
}
function filtraCatalogo(q){
  q=q.toLowerCase();document.querySelectorAll('#lista-add .bloque-cap').forEach(b=>{
    const ok=b.dataset.cap.includes(q)||b.dataset.nombres.includes(q);b.style.display=ok?'':'none'})}
function modalMedicionNueva(pid,cid){
  const x=db.catalogo.find(y=>y.id===cid);
  let cap=pActual().capitulos.find(c=>c.nombre===x.cap);
  if(!cap){cap={nombre:x.cap,items:[]};pActual().capitulos.push(cap)}
  cap.items.push({catId:cid,nombre:x.nombre,ud:x.ud,precio:x.precio,cantidad:0});
  guardar();cerrarModal();render();
  const ci=pActual().capitulos.indexOf(cap),ii=cap.items.length-1;
  modalMedicion(pid,ci,ii);
}
function modalMedicion(pid,ci,ii){
  const it=pActual().capitulos[ci].items[ii];
  modal(`<div class="fila-entre"><h2>Medición</h2><button class="modal-cerrar" onclick="cerrarModal()">×</button></div>
  <div class="suave" style="margin-bottom:6px">${esc(it.nombre)}</div>
  <label>Cantidad (${esc(it.ud)})</label><input id="m-can" type="number" step="0.01" value="${it.cantidad}">
  <label>Precio (€/${esc(it.ud)}) — se puede ajustar en esta obra</label><input id="m-pre" type="number" step="0.01" value="${it.precio}">
  <div class="zona-precio"><div class="fila"><span class="suave">Importe</span><span class="imp" id="m-imp">${eur(it.cantidad*it.precio)}</span></div></div>
  <div style="height:12px"></div><button class="boton" onclick="guardarMedicion('${pid}',${ci},${ii})">Guardar medición</button>`);
  document.getElementById('m-can').oninput=document.getElementById('m-pre').oninput=()=>{
    const c=parseFloat(document.getElementById('m-can').value)||0,p=parseFloat(document.getElementById('m-pre').value)||0;
    document.getElementById('m-imp').textContent=eur(c*p)};
}
function guardarMedicion(pid,ci,ii){
  const it=pActual().capitulos[ci].items[ii];
  it.cantidad=parseFloat(v('m-can'))||0;it.precio=parseFloat(v('m-pre'))||0;
  guardar();cerrarModal();render();
}
function quitarItem(pid,ci,ii){pActual().capitulos[ci].items.splice(ii,1);guardar();render()}
function quitarCap(pid,ci){if(!confirm('¿Eliminar capítulo y sus partidas?'))return;pActual().capitulos.splice(ci,1);guardar();render()}

function setCliente(pid,val){const p=pActual();p.clienteId=val||null;p.clienteNombre=(db.clientes.find(c=>c.id===val)||{}).nombre||'';guardar();render()}
function setObra(pid,val){pActual().obra=val;guardar()}
function setRef(pid,val){pActual().referencia=val;guardar()}
function setIva(pid,val){pActual().iva=parseFloat(val)||0;guardar();render()}

function duplicar(id){
  const p=pActual();const n='E'+(db.seq++);guardar();
  const copia=JSON.parse(JSON.stringify(p));
  copia.id='p'+Date.now();copia.numero=n;copia.fecha=new Date().toLocaleDateString('es-ES');copia.estado='borrador';
  db.presupuestos.push(copia);guardar();presuAbierto=copia.id;render();
}
function marcarEnviado(id){const p=pActual();p.estado=p.estado==='borrador'?'enviado':'borrador';guardar();render()}
function borrarPresu(id){if(!confirm('¿Eliminar presupuesto?'))return;db.presupuestos=db.presupuestos.filter(p=>p.id!==id);presuAbierto=null;vista='presupuestos';render()}

function modalObs(){modal(`<div class="fila-entre"><h2>Plantilla de observaciones</h2><button class="modal-cerrar" onclick="cerrarModal()">×</button></div>
  <textarea id="o-pl" rows="12">${esc(db.obsPlantilla)}</textarea>
  <div style="height:10px"></div><button class="boton" onclick="db.obsPlantilla=v('o-pl');guardar();cerrarModal()">Guardar plantilla</button>`)}
function modalObsPresu(pid){modal(`<div class="fila-entre"><h2>Observaciones · ${esc(pActual().numero)}</h2><button class="modal-cerrar" onclick="cerrarModal()">×</button></div>
  <textarea id="o-pr" rows="12">${esc(pActual().obs)}</textarea>
  <div style="height:10px"></div><button class="boton" onclick="pActual().obs=v('o-pr');guardar();cerrarModal();render()">Guardar</button>`)}

function guardarEmpresa(){
  Object.assign(db.empresa,{nombre:v('e-nombre'),direccion:v('e-dir'),poblacion:v('e-pob'),cif:v('e-cif'),tel:v('e-tel'),email:v('e-mail'),iban:v('e-iban'),beneficiario:v('e-ben'),iva:parseFloat(v('e-iva'))||0});
  guardar();render();alert('Ajustes guardados');
}
function reset(){localStorage.removeItem(K);cargar();render()}

const v=id=>{const e=document.getElementById(id);return e?e.value:''};

/* =========================================================
   PDF
   ========================================================= */
function vistaPDF(id){
  const p=db.presupuestos.find(x=>x.id===id);if(!p)return;
  const t=totales(p),e=db.empresa;
  const c=db.clientes.find(x=>x.id===p.clienteId)||{};
  const casa='<svg class="casa" width="42" height="37" viewBox="0 0 44 38"><path d="M22 1 L43 19 H35.5 V37 H26 V24 H18 V37 H8.5 V19 H1 Z" fill="#ADD8C7"/></svg>';
  const nCaps=p.capitulos.length;
  const filas=p.capitulos.map((cap,ci)=>{
    let h=`<tr class="capitulo"><td colspan="4">${esc(cap.nombre)}</td><td></td><td class="num">${eur(cap.importe)}</td></tr>`;
    cap.items.forEach((it,ii)=>{
      const ult=(ci===nCaps-1&&ii===cap.items.length-1)?' class="ultimo"':'';
      h+=`<tr${ult}><td style="width:40%">${esc(it.nombre)}</td>
      <td class="num">${num(it.precio)}€</td><td class="num">${num(it.cantidad)}</td>
      <td class="num">${eur(it.importe)}</td><td style="text-align:center">${p.iva}%</td>
      <td class="num">${eur(it.importe)}</td></tr>`});
    return h}).join('');
  document.getElementById('vista-pdf').innerHTML=`
  <div class="pagina-pdf">
    <div class="pdf-cab">
      <div>
        <div class="pdf-titulo-doc">Presupuesto</div>
        <div class="pdf-numfecha"><table>
          <tr><td>Número #</td><td>${esc(p.numero)}</td></tr>
          <tr><td>Fecha</td><td>${esc(p.fecha)}</td></tr>
        </table></div>
      </div>
      <div class="pdf-marca">${casa}
        <div class="nombre"><div class="l1">METRO<br>CUADRADO</div><div class="l2">CONSTRUCCIÓN<br>Y&nbsp;REFORMAS</div></div>
      </div>
    </div>
    <div class="pdf-doscol">
      <div><b>${esc(e.nombre)}</b><br>${esc(e.direccion)}<br>${esc(e.poblacion)}<br>${esc(e.cif)}<br>${esc(e.tel)}<br>${esc(e.email)}</div>
      <div><b>Cliente</b><br>${esc(c.nombre||p.clienteNombre||'—')}${c.cif?'<br>'+esc(c.cif):''}${c.direccion?'<br>'+esc(c.direccion):''}${c.poblacion?'<br>'+esc(c.poblacion):''}${c.tel?'<br>'+esc(c.tel):''}</div>
    </div>
    <table class="pdf-tabla">
      <tr><th>Concepto</th><th class="num">Precio</th><th class="num">Unidades</th><th class="num">Subtotal</th><th style="text-align:center">IVA</th><th class="num">Total</th></tr>
      ${filas}
    </table>
    <div class="pdf-tot"><table>
      <tr><td class="et">BASE IMPONIBLE</td><td class="vl">${eur(t.base)}</td></tr>
      <tr><td class="et">IVA ${p.iva}%</td><td class="vl">${eur(t.iva)}</td></tr>
      <tr class="final"><td>TOTAL</td><td class="vl">${eur(t.total)}</td></tr>
    </table></div>
    <div class="pdf-obs"><h4>Observaciones</h4>${esc(p.obs).replace(/\n/g,'<br>')}</div>
    <div class="pdf-pago"><h4>Condiciones de pago</h4>Transferencia Bancaria<br>IBAN: ${esc(e.iban)}<br>BENEFICIARIO: ${esc(e.beneficiario)}</div>
    <div class="pdf-pie"><span>${esc(p.numero)} - ${eur(t.total)}</span><span>Pág. 1 de 1</span></div>
  </div>`;
  /* botón flotante volver + imprimir */
  const barra=document.createElement('div');
  barra.style.cssText='position:fixed;top:10px;right:10px;z-index:999;display:flex;gap:8px';
  barra.innerHTML='<button onclick="location.reload()" style="display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid #ccc;border-radius:8px;padding:8px 14px;font-weight:700">'+ico('back',15)+' Volver</button>'+
                   '<button onclick="window.print()" style="display:inline-flex;align-items:center;gap:7px;background:#add8c7;color:#253832;border-radius:8px;padding:8px 14px;font-weight:700">'+ico('print',15)+' Imprimir / Guardar PDF</button>';
  document.body.appendChild(barra);
  window.__barra=barra;
  /* en pantalla mostramos una vista previa */
  document.getElementById('vista-pdf').style.display='block';
  document.getElementById('app').style.display='none';
  ajustarZoomPDF();
  window.addEventListener('resize',ajustarZoomPDF);
  window.addEventListener('afterprint',()=>{location.reload()});
}
/* Escala la vista previa del PDF al ancho disponible (pantalla); al imprimir queda A4 real */
function ajustarZoomPDF(){
  const pg=document.querySelector('.pagina-pdf');
  if(!pg)return;
  const disp=Math.min(window.innerWidth,window.document.documentElement.clientWidth)-16;
  const ANCHO=794; /* 210mm a 96dpi */
  const z=Math.min(1,disp/ANCHO);
  if(z<1){pg.style.zoom=z}else{pg.style.zoom=''}
}

/* ===== Arranque ===== */
cargar();
pintaIconos();
render();
</script>
</body>
</html>
